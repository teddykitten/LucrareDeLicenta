<form [formGroup]="rowsForm" (ngSubmit)="onSubmit()">
  <div class="submit-form">
    <label for="name">Name </label>
    <input
      type="text"
      class="form-control"
      id="name"
      name="name"
      formControlName="name"
    />


    <div formArrayName="rows">
      <div *ngFor="let row of rows.controls; let i=index">
        <div [formGroupName]="i">
          Row {{i + 1}}
          Number of seats :
          <label for="name"></label>
          <input
            type="text"
            class="form-control"
            id="Seats"
            name="Seats"
            formControlName="seat"
          />

          <button (click)="removeRows(i)" class="remove">Remove</button>
        </div>
      </div>
    </div>

    <div class="space">
      <p>
        <button (click)="addRows()" type="button" class="bn3">Add</button>
      </p>
      <button type="submit" class="btn-submit">Submit</button>
      <div *ngIf="submitted">
        <h4>Hall was submitted successfully!</h4>
        <button (click)="goBack()" type="button" class="btn-back">Back</button>
      </div>
    </div>
  </div>
</form>
