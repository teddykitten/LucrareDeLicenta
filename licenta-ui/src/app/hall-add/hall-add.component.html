<form [formGroup]="rowsForm" (ngSubmit)="onSubmit()">

  <p>
    <label for="name">Name </label>
    <input type="text" id="name" name="name" formControlName="name">
  </p>


  <div formArrayName="rows">
    <div *ngFor="let row of rows.controls; let i=index">
      <div [formGroupName]="i">
        Row {{i}}
        Number of seats :
        <input type="text" formControlName="seat">
<!--        number:-->
<!--        <input type="text" formControlName="number">-->

        <button (click)="removeRows(i)">Remove</button>
      </div>
    </div>
  </div>

  <p>
    <button type="submit">Submit</button>
  </p>

</form>


<p>
  <button type="button" (click)="addRows()">Add</button>
</p>

{{this.rowsForm.value | json}}
