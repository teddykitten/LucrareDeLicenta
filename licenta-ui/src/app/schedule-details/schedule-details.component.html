
  <div *ngIf="currentSchedule.id">
    <h4>Schedule</h4>
    <div>
      <label><strong>Date:</strong></label> {{ currentSchedule.date }}
    </div>
    <div>
      <label><strong>Movie:</strong></label> {{ currentSchedule.movie.name }}
    </div>
    <div>
      <label><strong>Hall:</strong></label> {{ currentSchedule.hall.name }}
    </div>


    <a
      class="badge badge-warning"
      routerLink="/schedule/{{ currentSchedule.id }}"
    >
      <div class="button-container">
        <button class="delete-button" (click)="deleteSchedule()">
          Delete
        </button>

      </div>
    </a>
  </div>
