<div class="list row">
  <div class="col-md-8">
    <div class="input-group mb-3">
      <input
        type="text"
        class="form-control"
        placeholder="Search by name"
        [(ngModel)]="name"
      />
      <div class="input-group-append">
        <button
          class="btn btn-outline-secondary"
          (click)="searchName()"
        >
          Search
        </button>
      </div>
    </div>
  </div>
  <div class>
    <span>
      <a routerLink="/actor-add" *ngIf="userService.roleMatch(['Admin'])" class="button-add">Add</a>
    </span>
  </div>
  <div class="col-md-6">
    <h4>Actors List</h4>
    <ul class="list-group">
      <li
        class="list-group-item"
        *ngFor="let actor of actors; let i = index"
        [class.active]="i == currentIndex"
        (click)="setActiveActor(actor, i)"
      >
        {{ actor.name }}
      </li>
    </ul>
  </div>
  <div class="col-md-6">
    <app-actor-details
      [viewMode]="true"
      [currentActor]="currentActor"
    ></app-actor-details>
  </div>
</div>
