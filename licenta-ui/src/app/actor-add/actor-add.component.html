<div>
  <div class="submit-form">
    <div *ngIf="!submitted">

      <div class="form-group">
        <label for="description">Name</label>
        <input
          class="form-control"
          id="description"
          required
          [(ngModel)]="actor.name"
          name="name"
        />
      </div>

      <div class="space">
        <button (click)="saveActor()" class="btn-submit">Submit</button>
        <button (click)="goBack()" class="btn-back">Back</button>
      </div>
    </div>
    <div *ngIf="submitted">
      <h4>Actor was submitted successfully!</h4>
      <button class="btn-submit" (click)="newActor()">Add</button>
      <button (click)="goBack()" class="btn-back">Back</button>
    </div>
  </div>
</div>
