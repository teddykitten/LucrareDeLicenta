<div>
  <div class="submit-form">
    <div *ngIf="!submitted">

      <div class="form-group">
        <label for="description">Name</label>
        <input
          class="form-control"
          id="description"
          required
          [(ngModel)]="actor.name"
          name="name"
        />
      </div>

      <button (click)="saveActor()" class="btn btn-success">Submit</button>
    </div>

    <div *ngIf="submitted">
      <h4>Actor was submitted successfully!</h4>
      <button class="btn btn-success" (click)="newActor()">Add</button>
    </div>
  </div>
</div>
