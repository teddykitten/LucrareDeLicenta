<div class="list row">
  <div class="col-md-8">
    <div class="input-group mb-3">
      <input
        type="text"
        class="form-control"
        placeholder="Search by name"
        [(ngModel)]="name"
      />
      <div class="input-group-append">
        <button
          class="btn btn-outline-secondary"
          (click)="searchName()"
        >
          Search
        </button>
      </div>
    </div>
  </div>
  <div class>
    <span>
      <a routerLink="/hall-add" class="button-add">Add</a>
    </span>
  </div>
  <div class="col-md-6">
    <h4>Hall List</h4>
    <ul class="list-group">
      <li
        class="list-group-item"
        *ngFor="let hall of halls; let i = index"
        [class.active]="i == currentIndex"
        (click)="setActiveHall(hall, i)"
      >
        {{ hall.name }}
      </li>
    </ul>
  </div>
  <div class="col-md-6">
    <app-hall-details
      [viewMode]="true"
      [currentHall]="currentHall"
    ></app-hall-details>
  </div>
</div>
