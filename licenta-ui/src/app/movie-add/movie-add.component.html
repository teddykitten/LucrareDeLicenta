<div>
  <div class="submit-form">
    <div *ngIf="!submitted">

      <div class="form-group">
        <label for="name">Name</label>
        <input
          class="form-control"
          id="name"
          required
          [(ngModel)]="movie.name"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <input
          class="form-control"
          id="description"
          required
          [(ngModel)]="movie.description"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="rating">Rating</label>
        <input
          class="form-control"
          id="rating"
          required
          [(ngModel)]="movie.rating"
          name="name"
        />
      </div>
      <div class="wrapper">
      </div>
      <div class="form-group">
        <label for="ageRestricted">Age restricted</label>
        <input
          class="form-control"
          id="ageRestricted"
          required
          [(ngModel)]="movie.ageRestricted"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="duration">Duration</label>
        <input
          class="form-control"
          id="duration"
          required
          [(ngModel)]="movie.duration"
          name="name"
        />
      </div>
      <div class="wrapper">
        <div class="inner-wrap">
          <mat-form-field>
            <mat-select
              [formControl]="genreCTRL"
              placeholder="Genre"
              [multiple]="true"
              #singleSelect
            >
              <mat-option>
                <ngx-mat-select-search
                  [formControl]="genreFilterCTRL"
                  placeholderLabel="Select movie genres..."
                  noEntriesFoundLabel="'no matching found'"
                  [showToggleAllCheckbox]="true"
                  toggleAllCheckboxTooltipMessage="Select / Unselect All"
                  [toggleAllCheckboxIndeterminate]="isIndeterminate"
                  [toggleAllCheckboxChecked]="isChecked"
                  (toggleAll)="toggleSelectAll($event)"
                >
                  <mat-icon ngxMatSelectSearchClear>delete</mat-icon>
                </ngx-mat-select-search>
              </mat-option>

              <mat-option *ngFor="let genre of filteredGenres | async" [value]="genre">
                {{ genre.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="inner-wrap">
          <h3>Selected Values</h3>
          <ul *ngFor="let genre of genreCTRL?.value">
            <li>{{ genre.name }}</li>
          </ul>
        </div>
      </div>

      <button (click)="saveMovie()" class="btn btn-success">Submit</button>
    </div>

    <div *ngIf="submitted">
      <h4>Movie was submitted successfully!</h4>
      <button class="btn btn-success" (click)="newMovie()">Add</button>
    </div>
  </div>
</div>
