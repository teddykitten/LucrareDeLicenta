<div>
  <div class="submit-form">
    <div *ngIf="!submitted">

      <div class="form-group">
        <label for="name">Name</label>
        <input
          class="form-control"
          id="name"
          required
          [(ngModel)]="movie.name"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <input
          class="form-control"
          id="description"
          required
          [(ngModel)]="movie.description"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="rating">Rating</label>
        <input
          class="form-control"
          id="rating"
          required
          [(ngModel)]="movie.rating"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="description">Genre</label>
        <input
          class="form-control"
          id="genre"
          required
          [(ngModel)]="movie.genre"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="ageRestricted">Age restricted</label>
        <input
          class="form-control"
          id="ageRestricted"
          required
          [(ngModel)]="movie.ageRestricted"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="duration">Duration</label>
        <input
          class="form-control"
          id="duration"
          required
          [(ngModel)]="movie.duration"
          name="name"
        />
      </div>

      <button (click)="saveMovie()" class="btn btn-success">Submit</button>
    </div>

    <div *ngIf="submitted">
      <h4>Movie was submitted successfully!</h4>
      <button class="btn btn-success" (click)="newMovie()">Add</button>
    </div>
  </div>
</div>
