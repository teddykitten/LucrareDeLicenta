<div *ngIf="viewMode; else editable">
  <div *ngIf="currentActor.id">
    <h4>Actor</h4>
    <div>
      <label><strong>Name:</strong></label> {{ currentActor.name }}
    </div>

    <a
      class="badge badge-warning"
      routerLink="/actor/{{ currentActor.id }}"
    >
      <button type="button" class="btn btn-primary">Edit</button>
    </a>
  </div>

  <div *ngIf="!currentActor">
    <br/>
    <p>Please click on an Actor...</p>
  </div>
</div>

<ng-template #editable>
  <div *ngIf="currentActor.id" class="edit-form">
    <h4>Actor</h4>
    <form>
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          class="form-control"
          id="name"
          [(ngModel)]="currentActor.name"
          name="name"
        />
      </div>
    </form>


    <button class="badge badge-danger mr-2" (click)="deleteActor()">
      Delete
    </button>

    <button
      type="submit"
      class="badge badge-success mb-2"
      (click)="updateActor()"
    >
      Update
    </button>
    <p>{{ message }}</p>
  </div>

  <div *ngIf="!currentActor.id">
    <br/>
    <p>Cannot access this Actor...</p>
  </div>
</ng-template>
