<div *ngIf="viewMode; else editable">
  <div *ngIf="currentMovie.id">
    <h4>Movie</h4>
    <div>
      <label><strong>Name:</strong></label> {{ currentMovie.name }}
    </div>
    <div>
      <label><strong>Description:</strong></label> {{ currentMovie.description }}
    </div>
    <div>
      <label><strong>Rating:</strong></label> {{ currentMovie.rating }}
    </div>
    <div>
      <label><strong>Genre:</strong></label> {{ currentMovie.genre }}
    </div>
    <div>
      <label><strong>Age Restricted:</strong></label> {{ currentMovie.ageRestricted }}
    </div>
    <div>
      <label><strong>Duration:</strong></label> {{ currentMovie.duration }}
    </div>

    <a
      class="badge badge-warning"
      routerLink="/movie/{{ currentMovie.id }}"
    >
      <button type="button" class="btn btn-primary">Edit</button>
    </a>
  </div>

  <div *ngIf="!currentMovie">
    <br/>
    <p>Please click on a Movie...</p>
  </div>
</div>

<ng-template #editable>
  <div *ngIf="currentMovie.id" class="edit-form">
    <h4>Movie</h4>
    <form>
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          class="form-control"
          id="name"
          [(ngModel)]="currentMovie.name"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <input
          type="text"
          class="form-control"
          id="description"
          [(ngModel)]="currentMovie.description"
          name="description"
        />
      </div>
      <div class="form-group">
        <label for="rating">Rating</label>
        <input
          type="text"
          class="form-control"
          id="rating"
          [(ngModel)]="currentMovie.rating"
          name="rating"
        />
      </div>
      <div class="form-group">
        <label for="age restricted">Age restricted</label>
        <input
          type="text"
          class="form-control"
          id="age restricted"
          [(ngModel)]="currentMovie.ageRestricted"
          name="age restricted"
        />
      </div>
      <div class="form-group">
        <label for="Duration">Duration</label>
        <input
          type="text"
          class="form-control"
          id="Duration"
          [(ngModel)]="currentMovie.duration"
          name="Duration"
        />
      </div>
      <div class="wrapper">
        <div class="inner-wrap">
          <mat-form-field>
            <mat-select
              [formControl]="genreCTRL"
              placeholder="Genre"
              [multiple]="true"
              #singleSelect
            >
              <mat-option>
                <ngx-mat-select-search
                  [formControl]="genreFilterCTRL"
                  placeholderLabel="Select movie genres..."
                  noEntriesFoundLabel="'no matching found'"
                  [showToggleAllCheckbox]="true"
                  toggleAllCheckboxTooltipMessage="Select / Unselect All"
                  [toggleAllCheckboxIndeterminate]="isIndeterminate"
                  [toggleAllCheckboxChecked]="isChecked"
                  (toggleAll)="toggleSelectAll($event)"
                >
                  <mat-icon ngxMatSelectSearchClear>delete</mat-icon>
                </ngx-mat-select-search>
              </mat-option>

              <mat-option *ngFor="let genre of filteredGenres | async" [value]="genre">
                {{ genre}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

    </form>

    <div class="button-container">
      <button class="delete-button" (click)="deleteMovie()">
        Delete
      </button>

      <button
        type="submit"
        class="edit-button"
        (click)="updateMovie()"
      >
        Update
      </button>
    </div>
    <p>{{ message }}</p>
  </div>
  <button (click)="goBack()" class="btn-back">Back</button>
  <div *ngIf="!currentMovie.id">
    <br/>
    <p>Cannot access this Movie...</p>
  </div>
</ng-template>
