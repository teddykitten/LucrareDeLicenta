<div class="list row">
  <div class>
  </div>
  <div class="col-md-6">
    <h4></h4>
    <ul class="list-group">
      <li
        class="list-group-item"
        *ngFor="let extendedSchedule of extendedSchedule; let i = index"
        [class.active]="i == currentIndex"
        (click)="setActiveSchedule(extendedSchedule, i)"
      >
        {{ extendedSchedule.schedule.movie.name }}
        {{extendedSchedule.schedule.date}}
      </li>
    </ul>
  </div>
  <form>
    <div *ngIf="currentExtendedSchedule.schedule.id">
      <div class="form-group">
        <ul class="list-group">
          <li class="list-group-item" *ngFor="let row of currentExtendedSchedule.hallRequestBody.rows; let i = index">
            Randul {{ i + 1 }}:
            <mat-button-toggle-group name="seat" aria-label="Seats" multiple [(ngModel)]="reservation.seats[i]">
              <mat-button-toggle
                *ngFor="let seat of [].constructor(currentExtendedSchedule.hallRequestBody.rows[i].seat); let s = index"
                value="{{i+1}},{{s+1}}" [disabled]="currentExtendedSchedule.seats.includes((i+1) + ',' + (s+1))">
                {{s + 1}}
              </mat-button-toggle>
            </mat-button-toggle-group>
          </li>
        </ul>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          class="form-control"
          id="email"
          required
          [(ngModel)]="reservation.email"
          name="email"
        />
      </div>
      <div class="space">
        <button (click)=onSubmit() class="btn-submit">Submit</button>
      </div>
    </div>
  </form>
</div>
